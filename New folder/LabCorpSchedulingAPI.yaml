  /fhir/appointments/times:
    get:
      summary: Query for available appointment times.
      description: >-
        Query for the available appointment time slots that match the filter
        criteria provided. Labcorp limits appointment times to within the next
        90 days, regardless of the search criteria given. The optional startDate
        and numberOfDays parameters can be used to shift the boundaries of the
        search results within that overall 90 day limitation, ie if startDate is
        80 days out then a maximum of 10 days worth of possible times can be
        returned even if more days are requested.
      parameters:
        - name: location
          in: query
          description: >-
            The requested location as denoted by using the system and code
            previously retrieved.
          schema:
            type: string
            pattern: '^urn:labcorp:locations\|(\d+)$'
            example: 'urn:labcorp:locations|13733'
          required: true
        - name: service
          in: query
          description: >-
            The requested service type as denoted by using the system and code
            previously retrieved.
          schema:
            type: string
            pattern: '^urn:labcorp:services\|(\d+)$'
            example: 'urn:labcorp:services|5'
          required: true
        - name: startDate
          in: query
          description: >-
            Optional starting date for returned values. Defaulting to today,
            this value can be in the future by up to 90 days.
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2019-01-24'
        - name: numberOfDays
          in: query
          description: >-
            Optional number of days, inclusive of startDate, to return
            appointment slots. This value is beween 1 and 90, with a default of
            7.
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
        - name: weekday
          in: query
          description: >-
            Optional day(s) of the week you would like to search for. This will
            filter the results to only the specified day(s) of the week.
          schema:
            type: array
            items:
              type: string
              enum:
                - MONDAY
                - TUESDAY
                - WEDNESDAY
                - THURSDAY
                - FRIDAY
                - SATURDAY
                - SUNDAY
        - name: timeframe
          in: query
          description: |-
            Optional time(s) of day against which to filter appointment times:
            * `MORNING` - prior to 10AM
            * `MIDDAY` - between 10AM and 2PM
            * `EVENING` - between 2PM and closing time
          schema:
            type: array
            items:
              type: string
              enum:
                - MORNING
                - MIDDAY
                - EVENING
      responses:
        '200':
          description: >-
            The returned bundle will contain the Slot entries for the available
            / free appointment slots that matched the input criteria.
          content:
            application/json+fhir:
              schema:
                type: object
                externalDocs:
                  description: FHIR resource bundle
                  url: 'https://www.hl7.org/fhir/bundle.html'
                properties:
                  resourceType:
                    type: string
                    example: Bundle
                  id:
                    type: string
                    description: JSON stringified search criteria
                  identifier:
                    type: array
                    items:
                      $ref: '#/components/schemas/FHIRIdentifier'
                  type:
                    type: string
                    enum:
                      - document
                      - message
                      - transaction
                      - transaction-response
                      - batch
                      - batch-response
                      - history
                      - searchset
                      - collection
                    example: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        resource:
                          $ref: '#/components/schemas/FHIRSlot'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                                - match
                                - include
                                - outcome
                  timestamp:
                    type: string
                    example: '2020-04-02T05:39:02.012Z'
                  total:
                    type: integer
                    description: Number of items in the entry list
                    example: 1
        '400':
          description: There was an error with the input.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIROperationOutcome'
              examples:
                FHIRValidationError:
                  $ref: '#/components/examples/FHIRValidationError'
        '401':
          description: Request is not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '502':
          description: Connection error to required services failed while searching.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIROperationOutcome'
              examples:
                FHIRGatewayError:
                  $ref: '#/components/examples/FHIRGatewayError'
      tags:
        - FHIR
  /fhir/appointments:
    post:
      summary: Schedule a new appointment.
      description: >-
        Schedule a new appointment for a patient at a particular Labcorp
        location. If an email and / or a phone number is provided with the
        patient data, then Labcorp will send confirmation messages when the
        appointment is successfully scheduled. If that contact information is
        not provided, then Labcorp will not send any messaging to the patient.
      requestBody:
        content:
          application/json+fhir:
            schema:
              $ref: '#/components/schemas/FHIREncryptedAppointment'
      responses:
        '200':
          description: The appointment has been successfully scheduled.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedAppointmentResponse'
        '400':
          description: The provided information was insufficient.
          content:
            application/json+fhir:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/FHIREncryptedOperationOutcome'
        '401':
          description: Request is not authorized.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/EncryptedAuthorizationError'
        '502':
          description: >-
            An error has occurred contacting another internal system, which
            prevents this request from completing.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedOperationOutcome'
      tags:
        - FHIR
  '/fhir/appointments/{id}':
    get:
      summary: Query an existing appointment.
      description: >-
        Using the provided appointment ID, search for the
        matching appointment record in Labcorp. This will not return a value if
        the appointment is cancelled, or the criteria did not find a match, or
        if the current partner ID is not the one that scheduled the appointment.
      parameters:
        - in: path
          name: id
          description: ID of an appointment.
          schema:
            type: string
          required: true
      responses:
        '200':
          description: An appointment record was found.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedAppointment'
        '401':
          description: Request is not authorized.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/EncryptedAuthorizationError'
        '404':
          description: No record was found.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedOperationOutcome'
        '502':
          description: >-
            An error has occurred contacting another internal system, which
            prevents this request from completing.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedOperationOutcome'
      tags:
        - FHIR
    put:
      summary: Update an existing appointment.
      description: >-
        An existing appointment can be updated to have entirely new content. If
        the appointment date or time is modified, then this will check and can
        fail like the schedule appointment call if that time is not available.
        This api will also return an error if the partner in the request is not
        the same partner as originally scheduled the appointment.
      parameters:
        - in: path
          name: id
          description: ID of an appointment.
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json+fhir:
            schema:
              $ref: '#/components/schemas/FHIREncryptedAppointment'
      responses:
        '200':
          description: An appointment record was found and updated.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedAppointment'
        '401':
          description: Request is not authorized.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/EncryptedAuthorizationError'
        '404':
          description: No record was found.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedOperationOutcome'
        '409':
          description: The requested appointment time is no longer available.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedOperationOutcome'
        '502':
          description: >-
            An error has occurred contacting another internal system, which
            prevents this request from completing.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedOperationOutcome'
      tags:
        - FHIR
  '/fhir/appointments/{id}/cancel':
    put:
      summary: Cancel a scheduled appointment.

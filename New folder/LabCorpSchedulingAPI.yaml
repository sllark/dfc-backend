  '/fhir/patients/{id}':
    get:
      summary: Access a patient record by id.
      description: >-
        Access a patient record with the associated id value. If this id is not
        found, perhaps after a delete, then a 404 Not Found is returned.
      parameters:
        - in: path
          name: id

            change the id value.
          content:
            application/json+fhir:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/FHIREncryptedOperationOutcome'
        '401':
          description: Request is not authorized.
          content:

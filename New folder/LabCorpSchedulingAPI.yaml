          $ref: '#/components/schemas/Channel'
    Channel:
      type: object
      required:
        - type
        - endpoint
      properties:
        type:
          type: string
          example: rest-hook
        endpoint:
          type: string
          example: 'https://partner/appointments/123'
          description: This is the callback endpoint where we call the partners back when there is an update on the object
        header:
          type: array
          items:
            type: string
            example: 'Authorization: Bearer secret-token-abc-123'
            description: provide any authorization or header needs to be added when we callback

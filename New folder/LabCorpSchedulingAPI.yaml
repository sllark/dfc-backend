          type: string
          enum:
            - home
            - work
            - temp
            - old
            - billing
        type:
          type: string
          enum:
            - postal
            - physical
            - both
        text:
          type: string
        line:
          type: array
          items:
            type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
    FHIRContactPoint:
      type: object
      externalDocs:
        description: FHIR contact specification
        url: 'https://www.hl7.org/fhir/datatypes.html#ContactPoint'
      required:
        - system
        - value
        - use
      properties:
        system:
          type: string
          enum:
            - phone
            - fax
            - email
            - pager
            - url
            - sms
            - other
        value:
          type: string
        use:
          type: string
          enum:
            - home
            - work
            - temp
            - old
            - mobile
        rank:
          type: integer
    FHIRCodeableConcept:
      type: object
      externalDocs:
        description: FHIR codeable concept specification
        url: 'https://www.hl7.org/fhir/datatypes.html#CodeableConcept'
      required:
        - coding
      properties:
        text:
          type: string
        coding:
          type: array
          items:
            type: object
            required:
              - code
            properties:
              system:
                type: string
              version:
                type: string
              code:
                type: string
              display:
                type: string
              userSelected:
                type: boolean
    FHIRReference:
      type: object
      description: 'At least one of reference, display, or identifier must be populated.'
      externalDocs:
        description: FHIR reference specification
        url: 'https://www.hl7.org/fhir/references.html#Reference'
      properties:
        type:
          type: string
          description: Typically would be the resourceType field being referenced
          example: Patient
        reference:
          type: string
        display:
          type: string
        identifier:
          $ref: '#/components/schemas/FHIRIdentifier'
    FHIRLocation:
      type: object
      externalDocs:
        description: FHIR location specification
        url: 'https://www.hl7.org/fhir/location.html'
      required:
        - status
        - mode
      properties:
        resourceType:
          type: string
          example: Location
        id:
          type: string
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/FHIRIdentifier'
        status:
          type: string
          enum:
            - active
            - suspended
            - inactive
        mode:
          type: string
          enum:
            - instance
            - kind
        name:
          type: string
        address:
          $ref: '#/components/schemas/FHIRAddress'
        position:
          type: object
          properties:
            latitude:
              type: number
              format: float
              example: 38.2258653
            longitude:
              type: number
              format: float
              example: -85.7255166
            extension:
              type: array
              items:
                $ref: '#/components/schemas/FHIRTimezoneExtension'
        telecom:
          type: array
          items:
            $ref: '#/components/schemas/FHIRContactPoint'
        hoursOfOperation:
          type: array
          items:
            type: object
            properties:
              daysOfWeek:
                type: array
                items:
                  type: string
                  enum:
                    - mon
                    - tue
                    - wed
                    - thu
                    - fri
                    - sat
                    - sun
              allDay:
                type: boolean
              openingTime:
                type: string
                example: '09:00:00'
              closingTime:
                type: string
                example: '17:30:00'
        type:
          type: array
          items:
            $ref: '#/components/schemas/FHIRCodeableConcept'
          description: LabCorp sites provide OUTLAB types only (out patient laboratory)
    FHIRSubscription:
      type: object
      externalDocs:
        description: FHIR subscription specification
        url: https://www.hl7.org/fhir/subscription.html
      required:
        - resourceType
        - criteria
        - status
        - channel
      properties:
        resourceType:
          type: string
          example: Subscription
        criteria:
          type: string
          example: 'Observation?name=/fhir/appointments/96278158'
        channel:
          $ref: '#/components/schemas/FHIRChannel'
    FHIRChannel:
      type: object
      externalDocs:
        description: FHIR subscription channel specification
        url: https://www.hl7.org/fhir/subscription-definitions.html#Subscription.channel
      required:
        - type
        - endpoint
      properties:
        type:
          type: string
          enum: [ rest-hook , websocket , email , sms , message ]
          description: Supports only rest-hook
          example: rest-hook
        endpoint:
          type: string
          example: 'https://partner/appointments/123'
          description: This is the callback endpoint where we call the partners back when there is an update on the object
        header:
          type: array
          items:
            type: string
            example: 'Authorization: Bearer secret-token-abc-123'
            description: provide any authorization or header needs to be added when we callback
        payload:
          type: string
          example: 'application/fhir+json'
    FHIRHealthcareService:
      type: object
      description: >-
        Labcorp provided healthcare service, this references a service coding
        provided by the /fhir/service-types endpoint.
      externalDocs:
        description: FHIR Healthcare Service specification
        url: 'https://www.hl7.org/fhir/healthcareservice.html'
      required:
        - resourceType
        - id
        - active
        - type
      properties:
        resourceType:
          type: string
          example: HealthcareService
        id:
          type: string
          example: '17'
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/FHIRIdentifier'
        active:
          type: boolean
        type:
          type: array
          items:
            $ref: '#/components/schemas/FHIRCodeableConcept'
          example:
            - coding:
                - system: 'urn:labcorp:services'
                  code: '17'
                  display: Employee Wellness with Body Measurement
        location:
          type: array
          items:
            $ref: '#/components/schemas/FHIRReference'
          example:
            - type: Location
              reference: locations/30950
        name:
          type: string
          example: Employee Wellness with Body Measurement
        availableTime:
          type: object
          properties:
            daysOfWeek:
              type: array
              items:
                type: string
                enum:
                  - mon
                  - tue
                  - wed
                  - thu
                  - fri
                  - sat
                  - sun
            allDay:
              type: boolean
              example: false
            availableStartTime:
              type: string
              example: '08:00:00'
            availableEndTime:
              type: string
              example: '16:45:00'
    FHIRExtension:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
      required:
        - id
        - url
    FHIRTimezoneExtension:
      oneOf:
       - $ref: "#/components/schemas/FHIRTimezoneCode"
       - $ref: "#/components/schemas/FHIRTimezoneOffset"
    FHIRTimezoneCode:
      allOf:
        - $ref: "#/components/schemas/FHIRExtension"
        - type: object
          properties:
            id:
              type: string
              enum:
                - 'TimezoneCode'
            url:
              type: string
              description: FHIR timezone code specification
              enum:
                - 'http://hl7.org/fhir/StructureDefinition/tz-code'
            valueCode:
              type: string
              example: 'America/Kentucky/Louisville'
          required:
            - valueCode
    FHIRTimezoneOffset:
      allOf:
        - $ref: "#/components/schemas/FHIRExtension"
        - type: object
          properties:
            id:
              type: string
              enum:
                - 'TimezoneOffset'
            url:
              type: string
              enum:
                - 'http://hl7.org/fhir/StructureDefinition/tz-offset'
              description: FHIR timezone offset specification
            valueString:
              description: The current UTC offset of the location's timezone.  The offset is computed by retrieving the
                           current time (as reported by the server clock) and deriving the UTC offset from that value.
              type: string
              example: '-04:00'
          required:
            - valueString
    FHIRSlot:
      type: object
      externalDocs:
        description: FHIR time slot specification
        url: 'https://www.hl7.org/fhir/slot.html'
      required:
        - resourceType
        - id
        - status
        - start
        - end
      properties:
        resourceType:
          type: string
          example: Slot
        id:
          type: string
          example: '2020-01-05T08:30'
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/FHIRIdentifier'
        status:
          type: string
          enum:
            - free
            - busy
            - busy-unavailable
            - busy-tentative
            - entered-in-error
        start:
          type: string
          example: '2020-01-05T08:30:00.000-05:00'
        end:
          type: string
          example: '2020-01-05T08:45:00.000-05:00'
        serviceType:
          type: array
          items:
            $ref: '#/components/schemas/FHIRCodeableConcept'
    FHIRSchedule:
      type: object
      externalDocs:
        description: FHIR time schedule specification
        url: 'https://www.hl7.org/fhir/schedule.html'
      properties:
        resourceType:
          type: string
          example: Schedule
        id:
          type: string
        planningHorizon:
          type: object
          externalDocs:
            description: FHIR time period specification
            url: 'https://www.hl7.org/fhir/datatypes.html#Period'
          properties:
            start:
              type: string
              example: '2020-01-05T08:30:00-0500'
            end:
              type: string
              example: '2020-01-05T08:45:00-0500'
    FHIRPatient:
      type: object
      externalDocs:
        description: FHIR Patient specification
        url: 'https://www.hl7.org/fhir/patient.html'
      required:
        - resourceType
        - name
        - gender
        - birthDate
        - address
      properties:
        resourceType:
          type: string
          example: Patient
        id:
          type: string
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/FHIRIdentifier'
        active:
          type: boolean
        name:
          type: object
          required:
            - use
            - family
            - given
          properties:
            use:
              type: string
              enum:
                - usual
                - official
                - temp
                - nickname
                - anonymous
                - old
                - maiden
            text:
              type: string
            family:
              type: string
            given:
              type: array
              items:
                type: string
              minItems: 1
            prefix:
              type: array
              items:
                type: string
            suffix:
              type: array
              items:
                type: string
        gender:
          type: string
          enum:
            - male
            - female
            - other
            - unknown
        birthDate:
          type: string
          description: >-
            Labcorp requires a full date, so this is more restrictive than FHIR
            by default.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2000-05-10'
        address:
          type: array
          items:
            $ref: '#/components/schemas/FHIRAddress'
          minItems: 1
        telecom:
          type: array
          items:
            $ref: '#/components/schemas/FHIRContactPoint'
    FHIRParticipant:
      type: object
      externalDocs:
        description: FHIR Participant specification
        url: >-
          https://www.hl7.org/fhir/appointment-definitions.html#Appointment.participant
      required:
        - actor
        - status
      properties:
        actor:
          $ref: '#/components/schemas/FHIRReference'
        required:
          type: string
          enum:
            - required
            - optional
            - information-only
        status:
          type: string
          enum:
            - accepted
            - declined
            - tentative
            - needs-action
    FHIRAppointment:
      type: object
      externalDocs:
        description: FHIR appointment specification
        url: 'https://www.hl7.org/fhir/appointment.html'
      required:
        - resourceType
        - status
        - participant
        - serviceType
        - slot
      properties:
        resourceType:
          type: string
          example: Appointment
        id:
          type: string
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/FHIRIdentifier'
        status:
          type: string
          enum:
            - proposed
            - pending
            - booked
            - arrived
            - fulfilled
            - cancelled
            - noshow
            - entered-in-error
            - checked-in
            - waitlist
        participant:
          type: array
          description: >-
            There must be at least one participant defined, as well as requiring
            both a patient participant and a location while attempting to
            schedule a new appointment. Only the patient participant is required
            during an appointment cancel request. The patient actor may exist
            within the Labcorp FHIR scheduling system through the patient CRUD
            APIs, or can be sent as a Base64 encoded JSON stringified patient
            record inside the actor display field. The suggested usage though is
            to create a patient record in Labcorp and use the actor identifier
            field from that creation.
          items:
            $ref: '#/components/schemas/FHIRParticipant'
          minItems: 1
          example:
            - actor:
                type: Patient
                identifier:
                  use: official
                  system: 'urn:labcorp:patients'
                  value: f94d8924-b1a3-41ff-8bc6-2a8ca1602d05
              required: required
              status: accepted
            - actor:
                type: Location
                identifier:
                  use: official
                  system: 'urn:labcorp:locations'
                  value: '30950'
              required: required
              status: tentative
        serviceType:
          type: array
          items:
            $ref: '#/components/schemas/FHIRCodeableConcept'
        slot:
          type: array
          description: >-
            The reference field of the slot must be the id value of a previously
            queried FHIRSlot object.
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/FHIRReference'
          example:
            - reference: '2020-01-01T08:30'
    FHIRAppointmentResponse:
      type: object
      externalDocs:
        description: FHIR appointment response
        url: 'https://www.hl7.org/fhir/appointmentresponse.html'
      required:
        - resourceType
        - id
        - appointment
        - actor
        - participantStatus
      properties:
        resourceType:
          type: string
          example: AppointmentResponse
        id:
          type: string
          example: '123'
        identifier:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/FHIRQrCode'
              - $ref: '#/components/schemas/FHIRConfirmationUrl'
              - $ref: '#/components/schemas/FHIRIdentifier'
        appointment:
          allOf:
            - $ref: '#/components/schemas/FHIRReference'
            - type: object
              example:
                type: Appointment
                identifier:
                  use: official
                  system: 'urn:labcorp:appointments'
                  value: '123'
        start:
          type: string
          example: '2020-01-05T08:30:00.000-05:00'
        end:
          type: string
          example: '2020-01-05T08:45:00.000-05:00'
        participantType:
          type: array
          items:
            $ref: '#/components/schemas/FHIRCodeableConcept'
          example: []
        actor:
          allOf:
            - $ref: '#/components/schemas/FHIRReference'
            - type: object
              example:
                type: Location
                identifier:
                  use: official
                  system: 'urn:labcorp:locations'
                  value: '30950'
        participantStatus:
          type: string
          enum:
            - accepted
            - declined
            - tentative
            - needs-action
        comment:
          type: string
    FHIRSubscriptionResponse:
      type: object
      required:
        - resourceType
        - id
      properties:
        id:
          type: string
          description: SubscriptionId
        resourceType:
          type: string
          example: 'Subscription'
    FHIREncryptedAppointment:
      type: object
      description: Generic FHIR encrypted appointment
      required:
        - value
      properties:
        value:
          example: AAAA...
          description: >-
            base64-encoded string details on how to create the string given in
            schema
          type: object
          properties:
            string($base64):
              description: >-
                map representation of base64-encoded string. Elements are joined
                in order specified with no joining operator
              type: object
              properties:
                iv:
                  description: 12 byte value used to create ciphertext.
                  type: string
                  format: binary
                  example: 00 11 22 33 44 55 66 77 88 99 aa bb
                ciphertext:
                  description: map representation of ciphertext blob.
                  type: object
                  properties:
                    string($binary):
                      description: >-
                        map representation depicting cipher, iv, plaintext, and
                        aad values.
                      type: object
                      properties:
                        algorithm:
                          type: string
                          enum:
                            - aes-256-gcm
                        iv:
                          description: any 12-byte value
                          type: string
                          format: binary
                          example: 00 11 22 33 44 55 66 77 88 99 aa bb
                        plaintext:
                          type: object
                          properties:
                            string(utf-8):
                              $ref: '#/components/schemas/FHIRAppointment'

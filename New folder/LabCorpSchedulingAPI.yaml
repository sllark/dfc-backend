        Cancel a currently scheduled appointment. Once complete, the appointment
        is permanently disabled and cannot be interacted with again. The patient
        must be included in the appointment participant list; however, the
        location is not required. If an email and / or a phone number was
        provided with the patient data during the original schedule call, then
        Labcorp will send cancellation messages when the appointment is
        successfully cancelled.

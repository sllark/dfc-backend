          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedOperationOutcome'
        '502':
          description: >-
            An error has occurred contacting another internal system, which
            prevents this request from completing.
          content:
            application/json+fhir:
              schema:
                $ref: '#/components/schemas/FHIREncryptedOperationOutcome'

      description: Update the existing patient record with the provided data.
      parameters:
        - in: path
          name: id
          description: ID property of a FHIRPatient object.
          schema:
            type: string
            example: f94d8924-b1a3-41ff-8bc6-2a8ca1602d05
          required: true
      requestBody:
        required: true
        content:

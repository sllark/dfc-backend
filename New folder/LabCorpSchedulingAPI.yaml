    FHIROperationOutcome:
      type: object
      externalDocs:
        description: FHIR operation outcome
        url: 'https://www.hl7.org/fhir/operationoutcome.html'
      required:
        - resourceType
        - issue
      properties:
        resourceType:
          type: string
          example: OperationOutcome
        id:
          type: string
        issue:
          type: array
          items:
            type: object
            required:
              - severity
              - code
            properties:
              severity:
                type: string
                enum:
                  - fatal
                  - error
                  - warning
                  - informational
              code:
                type: string
                example: required
                externalDocs:
                  description: IssueType code value
                  url: 'https://www.hl7.org/fhir/valueset-issue-type.html'
              details:
                allOf:
                  - $ref: '#/components/schemas/FHIRCodeableConcept'
                  - type: object
                    description: >-
                      When provided, the details will attempt to indicate where
                      the problem occurred. Either through the text string or
                      through the coding list, ie request validation errors will
                      populate the coding list with references to the failing
                      input values or fields and why they failed.
              diagnostics:
                type: string
              expression:
                type: array
                items:
                  type: string
  examples:
    FHIRValidationError:
      value:
        resourceType: OperationOutcome
        issue:
          - code: invalid
            severity: error
            details:
              coding:
                - code: radius
                  display: radius should not be empty
    FHIRNotFoundError:
      value:
        resourceType: OperationOutcome
        issue:
          - code: not-found
            severity: error
            details:
              coding: []
              text: Error resolving patient
    FHIRConflictError:
      value:
        resourceType: OperationOutcome
        issue:
          - code: exception
            severity: error
            details:
              codeing: []
              text: Appointment time no longer valid
    FHIRInternalError:
      value:
        resourceType: OperationOutcome

# Production Docker Compose Configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  api:
    build: .
    image: drugfreecompliance-api:latest
    container_name: drugfreecompliance-api-prod
    restart: always
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - drugfreecompliance-network-prod
    volumes:
      - uploads_data_prod:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: drugfreecompliance-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mybizhelperapi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drugfreecompliance-network-prod
    env_file:
      - .env

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: drugfreecompliance-pgadmin-prod
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@drugfreecompliance.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'True'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data_prod:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - drugfreecompliance-network-prod

  # Note: Mailpit is NOT included in production
  # Production uses Resend API for email delivery

volumes:
  postgres_data_prod:
    driver: local
  pgadmin_data_prod:
    driver: local
  uploads_data_prod:
    driver: local

networks:
  drugfreecompliance-network-prod:
    driver: bridge
